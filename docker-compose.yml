version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: productai-studio
    ports:
      - "${PORT:-80}:3000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
    volumes:
      # Persist SQLite database
      - ./data:/app/data
      # Persist config
      - ./config.json:/app/config.json
    restart: unless-stopped
    networks:
      - productai-network
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

networks:
  productai-network:
    driver: bridge
